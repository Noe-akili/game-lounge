[package]
name = "game-lounge-rust"
version = "1.0.0"
description = "Game Lounge - backend en Rust pour Tauri (application Android légère)"
authors = ["Game Lounge"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "game_lounge_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["supabase-sync"]
supabase-sync = ["dep:tokio-postgres", "dep:postgres-types", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots", "dep:dotenvy"]

[dependencies]
tauri = { version = "2", features = [] }
# Plugin opener nécessaire pour gérer les PDF / liens externes sans crasher le WebView Android
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
# Notifications natives (Android) : fin de session automatique (temps écoulé)
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled compile sqlite pour Android (lourd mais sûr) ; limite à 1 target pour accélérer build
rusqlite = { version = "0.31", features = ["bundled"] }
jsonwebtoken = "9"
scrypt = "0.11"
bcrypt = "0.15"
argon2 = "0.5"
rand = "0.8"
regex = "1"
base64 = "0.22"
# "clock" : requis pour chrono::Local (heure locale dans les logs 1.log)
chrono = { version = "0.4", features = ["serde", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "rt", "sync", "time", "fs", "io-util"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"], optional = true }
postgres-types = { version = "0.2", optional = true }
tokio-postgres-rustls = { version = "0.7", optional = true }
rustls = { version = "0.19", optional = true }
webpki-roots = { version = "0.21", optional = true }
dotenvy = { version = "0.15", optional = true }

# panic = unwind (PAS abort) : un panic dans une tâche background (pull Supabase, import PDF)
# ne doit JAMAIS tuer tout le processus Android. Avec abort, tout panic = app qui se ferme
# brutalement quelques secondes après l'entrée. Avec unwind, la tâche fautive meurt seule,
# les catch_unwind existants fonctionnent, et l'invoke renvoie une erreur au JS.
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true