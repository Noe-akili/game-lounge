[package]
name = "game-lounge-rust"
version = "1.0.0"
description = "Game Lounge - backend en Rust pour Tauri (application Android légère)"
authors = ["Game Lounge"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "game_lounge_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
jsonwebtoken = "9"
scrypt = "0.11"
bcrypt = "0.15"
rand = "0.8"
regex = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true