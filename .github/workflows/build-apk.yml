name: Build Game Lounge APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Bundle server for Android
        run: node server/build-server.mjs

      - name: Verify dist/nodejs
        run: ls -la dist/nodejs/ && du -sh dist/nodejs/

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android assets
        run: |
          echo "=== public/ ==="
          ls android/app/src/main/assets/public/ 2>/dev/null || echo "no public/"
          echo "=== nodejs/ ==="
          ls android/app/src/main/assets/public/nodejs/ 2>/dev/null || echo "no nodejs/"
          echo "=== Size ==="
          du -sh android/app/src/main/assets/

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Build Release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease || true

      - name: Check APK sizes
        run: |
          echo "=== Debug APK ==="
          find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          echo "=== Total build size ==="
          du -sh android/app/build/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: game-lounge-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: hashFiles('android/app/build/outputs/apk/release/*.apk') != ''
        with:
          name: game-lounge-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
