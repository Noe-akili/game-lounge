name: Build Android APK (Pure Frontend)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --platform=linux

      - name: Build frontend
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/release.keystore \
            -alias gamlounge \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass gamlounge123 \
            -keypass gamlounge123 \
            -dname "CN=Game Lounge, OU=Mobile, O=Game Lounge, L=Kinshasa, S=Kinshasa, C=CD"

      - name: Configure release signing
        working-directory: android
        run: |
          cat >> app/build.gradle << 'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "gamlounge123"
                      keyAlias "gamlounge"
                      keyPassword "gamlounge123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          GRADLE

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease

      - name: Check APK sizes
        run: |
          for apk in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk; do
            if [ -f "$apk" ]; then
              SIZE=$(stat -c%s "$apk")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "$apk: ${SIZE_MB}MB"
            fi
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: game-lounge-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v5
        with:
          name: game-lounge-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
