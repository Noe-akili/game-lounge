name: Build Android APK (Full Bundle)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --platform=linux

      - name: Create server .env
        run: |
          mkdir -p server
          cat > server/.env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EOF
          echo "DATABASE_URL length: ${#DATABASE_URL}"

      - name: Build frontend
        run: npm run build

      - name: Bundle server for Android
        run: npm run build:server

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$ANDROID_HOME/cmdline-tools"
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            rm cmdline-tools.zip
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/release.keystore \
            -alias gamlounge \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass gamlounge123 \
            -keypass gamlounge123 \
            -dname "CN=Game Lounge, OU=Mobile, O=Game Lounge, L=Kinshasa, S=Kinshasa, C=CD"

      - name: Configure release signing
        working-directory: android
        run: |
          cat >> app/build.gradle << 'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "gamlounge123"
                      keyAlias "gamlounge"
                      keyPassword "gamlounge123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          GRADLE

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease

      - name: Check APK sizes
        run: |
          for apk in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk; do
            if [ -f "$apk" ]; then
              SIZE=$(stat -c%s "$apk")
              SIZE_MB=$((SIZE / 1024 / 1024))
              echo "$apk: ${SIZE_MB}MB"
            fi
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: game-lounge-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v5
        with:
          name: game-lounge-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
