name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Bundle server for CapacitorNodeJS plugin
        run: |
          npx esbuild server/server.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --outfile=public/nodejs/server.js \
            --external:nodemailer \
            --external:@neondatabase/serverless \
            --external:sql.js
          echo '{"name":"game-lounge-server","version":"1.0.0","type":"module","main":"server.js"}' > public/nodejs/package.json

      - name: Include sql.js (WASM) in bundle
        run: |
          mkdir -p public/nodejs/node_modules/sql.js/dist
          cp node_modules/sql.js/dist/sql-wasm.js public/nodejs/node_modules/sql.js/dist/
          cp node_modules/sql.js/dist/sql-wasm.wasm public/nodejs/node_modules/sql.js/dist/
          cp node_modules/sql.js/package.json public/nodejs/node_modules/sql.js/

      - name: Copy frontend into server/public for Express static serving
        run: |
          mkdir -p public/nodejs/public
          cp -r dist/* public/nodejs/public/
          echo "Server assets:"
          ls public/nodejs/
          echo "Frontend in server:"
          ls public/nodejs/public/ | head -5

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-lounge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
