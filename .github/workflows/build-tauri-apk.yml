name: Build Android APK (Tauri / Rust backend)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'server-rust/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config*.ts'
      - '.github/workflows/build-tauri-apk.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'server-rust/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config*.ts'
      - '.github/workflows/build-tauri-apk.yml'
  workflow_dispatch:

jobs:
  build-tauri-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 27.1.12297006
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SUPABASE_DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Garde-fou v1.1 : le backend Rust embarque l'URL cloud à la COMPILATION
      # (option_env!("DATABASE_URL")). Sans ce secret, l'APK ne connaît AUCUNE
      # adresse cloud : la synchronisation resterait muette jusqu'à une saisie
      # manuelle dans Admin > Paramètres > Synchronisation. On distingue donc :
      #   - push de branche  -> avertissement, l'APK est publié en artefact
      #     (utile pour la recette : l'URL peut être saisie dans l'app) ;
      #   - tag vX.Y.Z       -> échec, on refuse de publier une Release qui ne
      #     pourrait pas synchroniser.
      # Secret à créer : gh secret set DATABASE_URL (URL du pooler Supabase,
      # mot de passe tourné). Le secret JWT_SECRET n'est plus utilisé (secret
      # unique par appareil).
      - name: Vérifier le secret cloud (masqué)
        run: |
          if [ -z "$DATABASE_URL" ]; then
            {
              echo "### Avertissement : APK construit sans URL cloud"
              echo ""
              echo "Le secret GitHub DATABASE_URL est absent, donc aucune adresse cloud n'est"
              echo "embarquée dans le binaire. Sur un appareil, la synchronisation restera inactive"
              echo "tant que l'URL n'aura pas été saisie dans Admin > Paramètres > Synchronisation."
              echo ""
              echo "Correction : gh secret set DATABASE_URL -b \"postgresql://app_lounge:...@...pooler.supabase.com:5432/postgres\""
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              echo "::error::Release refusée : secret DATABASE_URL absent, l'APK publié ne pourrait se connecter à aucun cloud."
              exit 1
            fi
            echo "::warning::APK construit sans URL cloud (secret DATABASE_URL absent) : synchronisation à configurer dans Admin > Paramètres > Synchronisation."
          else
            echo "URL cloud utilisée au build : $(printf '%s' "$DATABASE_URL" | sed -E 's#://[^@]*@#://***@#')"
            case "$DATABASE_URL" in
              *pooler.supabase.com*) echo "✅ Hôte Supabase (pooler) détecté." ;;
              *) echo "::warning::L'URL cloud ne ressemble pas à un hôte pooler Supabase : vérifiez la rotation du secret." ;;
            esac
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate Vue frontend
        run: |
          npm run type-check
          npm run build:mobile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rust/src-tauri

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # L'acceptation interne de l'action échoue depuis la mise à jour de
          # l'image runner (cmdline-tools 16.0 : sdkmanager attend une entrée
          # interactive). On désactive et on accepte nous-mêmes avec `yes |`.
          accept-android-sdk-licenses: false
          # Le paquet par défaut "tools" (obsolète) n'existe plus dans le
          # cmdline-tools 16.0 -> "Failed to find package 'tools'". On
          # n'installe ici que platform-tools (le reste vient de notre step).
          packages: platform-tools

      - name: Install Android SDK packages (platform, build-tools, NDK)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${{ env.NDK_VERSION }}" > /dev/null 2>&1
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install Tauri CLI
        working-directory: server-rust
        run: npm install

      - name: Build real Vue frontend for mobile (server-rust/dist)
        working-directory: server-rust
        run: npm run build:frontend

      - name: Generate Android project (tauri android init)
        working-directory: server-rust
        run: npm run android:init

      - name: Patch edge-to-edge (interface sous la barre de statut)
        run: bash scripts/patch-android-edge-to-edge.sh

      - name: Build Android APK (tauri android build --apk, universal)
        working-directory: server-rust
        run: npm run android:build

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/game-lounge.keystore

      - name: Sign APK with apksigner
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          APK_DIR="server-rust/src-tauri/gen/android/app/build/outputs/apk/universal/release"
          UNSIGNED_APK="$APK_DIR/app-universal-release-unsigned.apk"
          ALIGNED_APK="$APK_DIR/app-universal-release-aligned.apk"
          SIGNED_APK="$APK_DIR/game-lounge.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Unsigned APK not found at $UNSIGNED_APK"
            ls -R server-rust/src-tauri/gen/android/app/build/outputs/apk/ || true
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          # Zipalign
          "$ZIPALIGN" -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # Sign
          "$APKSIGNER" sign \
            --ks /tmp/game-lounge.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          # Verify
          "$APKSIGNER" verify "$SIGNED_APK"
          echo "✅ Signed APK: $SIGNED_APK"
          ls -lh "$SIGNED_APK"

      - name: List APK outputs
        run: |
          ls -R server-rust/src-tauri/gen/android/app/build/outputs/apk/ || true
          find server-rust/src-tauri/gen/android/app/build/outputs -name '*.apk' -print -exec stat -c %s {} \;

      - name: Upload APK (signed only)
        uses: actions/upload-artifact@v5
        with:
          name: game-lounge-tauri-apk
          path: server-rust/src-tauri/gen/android/app/build/outputs/apk/universal/release/game-lounge.apk
          retention-days: 30
          if-no-files-found: error

      # Publication permanente (les artefacts expirent au bout de 30 jours).
      # Déclenchée par un tag vX.Y.Z : `git push origin v1.1.0`.
      - name: Publier la Release GitHub (tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="server-rust/src-tauri/gen/android/app/build/outputs/apk/universal/release/game-lounge.apk"
          APP_VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\)".*/\1/p' server-rust/src-tauri/tauri.conf.json | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} incohérent : l'app est en $APP_VERSION. Utilisez scripts/bump-version.mjs avant de tagger."
            exit 1
          fi

          # Section du CHANGELOG correspondant à cette version (entre deux « ## [ »).
          NOTES=$(awk -v v="## [${TAG_VERSION}]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md 2>/dev/null || true)

          ASSET="game-lounge-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$ASSET"
          echo "Asset : $ASSET ($(stat -c %s "$ASSET") octets)"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --title "Game Lounge ${GITHUB_REF_NAME}" \
              --notes "${NOTES:-APK signé, installable par-dessus la version précédente.}"
          fi
          echo "✅ Release ${GITHUB_REF_NAME} publiée."
