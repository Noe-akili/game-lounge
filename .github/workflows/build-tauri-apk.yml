name: Build Android APK (Tauri / Rust backend)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server-rust/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config*.ts'
      - '.github/workflows/build-tauri-apk.yml'
  workflow_dispatch:

jobs:
  build-tauri-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      NDK_VERSION: 27.1.12297006

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rust/src-tauri

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (platform, build-tools, NDK)
        run: |
          sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${{ env.NDK_VERSION }}" > /dev/null 2>&1
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install Tauri CLI
        working-directory: server-rust
        run: npm install

      - name: Build real Vue frontend for mobile (server-rust/dist)
        working-directory: server-rust
        run: npm run build:frontend

      - name: Generate Android project (tauri android init)
        working-directory: server-rust
        run: npm run android:init

      - name: Build Android APK (tauri android build --apk)
        working-directory: server-rust
        run: npm run android:build

      - name: List APK outputs
        run: |
          ls -R server-rust/src-tauri/gen/android/app/build/outputs/apk/ || true
          find server-rust/src-tauri/gen/android/app/build/outputs -name '*.apk' -print -exec stat -c %s {} \;

      - name: Upload APK (debug + release)
        uses: actions/upload-artifact@v5
        with:
          name: game-lounge-tauri-apk
          path: server-rust/src-tauri/gen/android/app/build/outputs/apk/
          retention-days: 30
          if-no-files-found: error